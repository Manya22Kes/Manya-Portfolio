<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Manya Keserwani — AI & ML Software Engineer | Full Stack Architect." />
    <title>Manya Keserwani Portfolio</title>
    
    <!-- Inline Theme Bootstrap: Guarantees Velvet Obsidian Dark by default on fresh visit/refresh -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('manya_portfolio_theme_v4');
          var theme = (saved === 'light') ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <!-- Google Fonts: Syne, Plus Jakarta Sans, Alex Brush, Playfair Display Italic, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Playfair+Display:ital,wght@1,400;1,600;1,700&family=JetBrains+Mono:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@500;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-void text-light antialiased" data-theme="dark">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
